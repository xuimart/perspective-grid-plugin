<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perspective Grid | Layout UXP</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:#282828;color:#e3e3e3;font:12px 'Segoe UI',sans-serif;letter-spacing:0}.panel{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}button,input,select{font:inherit;color:inherit}button,select,input[type=number]{border:1px solid #505050;border-radius:3px;background:#353535;height:28px;min-width:0}button{padding:0 9px;cursor:pointer}button:hover{background:#454545}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #8fb9df;outline-offset:1px}header{height:37px;flex:0 0 37px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid #191919}header img{width:19px;height:19px;margin-right:8px}header strong{font-size:12px;font-weight:600}.version{margin-left:auto;font-size:10px;color:#999}.document{padding:8px 12px 0;flex:0 0 auto;font-size:10px;color:#a8a8a8;display:flex;justify-content:space-between}.orientation{display:flex;align-items:center;flex:0 0 106px;padding:8px 12px;border-bottom:1px solid #393939}.cube{width:88px;height:88px;flex:0 0 88px;cursor:grab;touch-action:none}.orientation-tools{flex:1;min-width:0;margin-left:14px}.caption{font-size:10px;color:#a8a8a8;margin-bottom:7px}.views{display:flex}.views button{flex:1;padding:0 3px;font-size:10px}.views button+button{margin-left:3px}.restore{margin-top:7px;width:100%;font-size:11px}.tabs{display:flex;flex:0 0 35px;padding:0 12px;border-bottom:1px solid #474747}.tabs button{flex:1;height:35px;background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:#aaa}.tabs button[aria-selected=true]{border-bottom-color:#91b5d5;color:#fff;font-weight:600}.scroll{flex:1 1 0;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px;scrollbar-width:thin;scrollbar-color:#555 #282828}.page[hidden]{display:none}.page>*{flex-shrink:0}.row{display:flex;align-items:center;min-height:30px;margin-bottom:9px}.row>label{width:100px;flex:0 0 100px;color:#bbb;font-size:11px}select{flex:1;width:100%;padding:0 6px;background:#353535}.section-title{font-weight:600;font-size:11px;margin:15px 0 10px;padding-top:12px;border-top:1px solid #414141}.section-title.first{margin-top:0;padding-top:0;border:0}.control{margin-bottom:10px}.control-head{display:flex;align-items:center;justify-content:space-between;min-height:25px;color:#bbb;font-size:11px}.number{display:flex;align-items:center}.number input{width:56px;text-align:right;padding:0 5px;height:24px;background:#222}.unit{width:25px;text-align:right;color:#929292;font-size:10px}input[type=range]{display:block;width:100%;height:16px;margin:4px 0 0;accent-color:#b2b2b2}input[type=checkbox]{accent-color:#91b5d5;margin:0 6px 0 0;width:13px;height:13px}.check{display:flex;align-items:center;font-size:11px;color:#ccc;min-height:27px}.inline-checks{display:flex;flex-wrap:wrap}.inline-checks .check{margin-right:14px}.pair{display:flex}.pair>*{flex:1;min-width:0}.pair>*+*{margin-left:9px}.small-action{font-size:11px}.xyz{display:flex;margin-bottom:12px}.xyz label{flex:1;min-width:0;font-size:10px;color:#aaa}.xyz label+label{margin-left:8px}.xyz input{display:block;width:100%;margin-top:5px;padding:0 6px;background:#222}.swatch{width:32px;height:24px;border:1px solid #666;border-radius:3px;padding:2px;background:#333}.color-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;color:#bbb;font-size:11px}.profile{display:flex;margin-bottom:12px}.profile button{flex:1;padding:0 4px;font-size:11px}.profile button+button{margin-left:5px}.profile button.active{border-color:#91b5d5;background:#36434c}.footer{flex:0 0 auto;padding:10px 12px;border-top:1px solid #4a4a4a;background:#282828}.apply{width:100%;height:32px;background:#35668f;border-color:#4f82ab;font-weight:600}.apply:hover{background:#427aa8}.footer-row{display:flex;align-items:center;margin-top:8px}.footer-row button{font-size:10px;height:26px;margin-right:5px}.footer-row label{margin-left:auto;font-size:10px}.status{font-size:10px;color:#aaa;margin-top:7px;min-height:14px;line-height:14px}.mode-select{margin-bottom:12px}button:disabled,input:disabled{opacity:.4}.depth-buttons{margin-top:9px}.legend{display:flex;align-items:center;justify-content:space-between}.tag{font-size:9px;color:#acbdc9} @media(max-height:540px){.orientation{flex-basis:78px;padding-top:4px;padding-bottom:4px}.cube{width:62px;height:62px;flex-basis:62px}.footer{padding-top:7px;padding-bottom:7px}.document{padding-top:5px}} @media(prefers-color-scheme:light){body{color:#e3e3e3}}
</style>
</head>
<body>
<main class="panel">
<header><img src="../../uxp/icons/icon.png" alt=""><strong>Perspective Grid</strong><span class="version">LAYOUT 02</span></header>
<div class="document"><span>Documento de exemplo</span><span>3840 × 2160 px</span></div>
<div class="orientation"><canvas class="cube" id="cube" width="176" height="176" title="Girar orientação" aria-label="Girar orientação"></canvas><div class="orientation-tools"><div class="caption">ORIENTAÇÃO</div><div class="views"><button data-view="front">Frente</button><button data-view="side">Lado</button><button data-view="top">Topo</button><button data-view="iso">¾</button></div><button class="restore" id="reset">Restaurar câmera</button></div></div>
<nav class="tabs" role="tablist" aria-label="Parâmetros"><button role="tab" aria-selected="true" data-tab="camera">Câmera</button><button role="tab" aria-selected="false" data-tab="grid">Grade</button><button role="tab" aria-selected="false" data-tab="model">Modelo</button></nav>
<div class="scroll">
<section class="page" id="camera" role="tabpanel">
<div class="row"><label for="perspective">Perspectiva</label><select id="perspective"><option value="two">2 pontos</option><option value="one">1 ponto</option><option value="three">3 pontos</option><option value="fish">Olho de peixe</option><option value="free">Livre</option><option value="ortho">Ortográfica</option></select></div>
<div class="section-title">Óptica</div>
<div id="lens-control"></div><div id="distortion-control" hidden></div><div id="zoom-control"></div>
<div class="section-title">Rotação</div><div id="yaw-control"></div><div id="pitch-control"></div><div id="roll-control"></div>
<div class="section-title">Enquadramento</div><div id="distance-control"></div><div id="panx-control"></div><div id="pany-control"></div>
</section>
<section class="page" id="grid" role="tabpanel" hidden>
<div class="legend"><label class="check"><input type="checkbox" checked>Mostrar grade</label><span class="tag">X · Y · Z</span></div>
<div class="section-title">Construção</div><div class="row"><select aria-label="Construção"><option>Raios de fuga</option><option>Malha espacial</option></select></div>
<div class="profile"><button class="active">Limpa</button><button>Anotada</button><button>Só linhas</button></div>
<div class="section-title">Quantidade de guias</div><div id="gx-control"></div><div id="gy-control"></div><div id="gz-control"></div>
<div class="inline-checks"><label class="check"><input type="checkbox" checked data-axis="gx">X</label><label class="check"><input type="checkbox" checked data-axis="gy">Y</label><label class="check"><input type="checkbox" checked data-axis="gz">Z</label></div>
<div class="section-title">Traço</div><div id="width-control"></div><div id="opacity-control"></div>
<div class="color-row"><label for="linecolor">Cor da grade</label><input class="swatch" type="color" id="linecolor" value="#728c99"></div><div class="color-row"><label for="horizoncolor">Cor do horizonte</label><input class="swatch" type="color" id="horizoncolor" value="#bc974e"></div>
<div class="section-title">Marcações</div><label class="check"><input type="checkbox" id="horizon" checked>Horizonte</label><label class="check"><input type="checkbox" id="vps" checked>Pontos de fuga</label><label class="check"><input type="checkbox" id="axisColors">Cores por eixo</label>
</section>
<section class="page" id="model" role="tabpanel" hidden>
<label class="check"><input type="checkbox" id="showmodel" checked>Mostrar modelo</label>
<div class="row"><label for="modeltype">Referência</label><select id="modeltype"><option>Caixa</option><option>Mesa</option><option>Quarto</option></select></div>
<div class="section-title">Dimensões</div><div id="scale-control"></div>
<div class="section-title">Posição no espaço</div><div class="xyz"><label>X<input type="number" value="0" step="0.5"></label><label>Y<input type="number" value="0" step="0.5"></label><label>Z<input type="number" value="0" step="0.5"></label></div>
<div class="pair"><button id="center">Centralizar</button><button id="fit">Enquadrar</button></div>
<div class="section-title">Movimento</div><select class="mode-select" id="movement" aria-label="Modo de movimento"><option>Mover no plano</option><option>Profundidade por PF</option></select>
<div class="row"><label for="axis">Direção</label><select id="axis"><option value="0">1PF · Eixo X</option><option value="2">2PF · Eixo Z</option><option value="1">Vertical · Eixo Y</option></select></div>
<div class="pair depth-buttons"><button id="back">Afastar</button><button id="forward">Aproximar</button></div>
</section>
</div>
<footer class="footer"><button class="apply" id="apply">Aplicar no documento</button><div class="footer-row"><button id="png">PNG</button><button id="svg">SVG</button><label class="check"><input type="checkbox">Ao soltar</label></div><div class="status" id="status" role="status">Prévia de layout · sem conexão com Photoshop</div></footer>
</main>
<script>
const initial={lens:35,distortion:100,zoom:100,yaw:43,pitch:0,roll:0,distance:16,panx:0,pany:0,gx:16,gy:12,gz:16,width:1.5,opacity:80,scale:1.5};const values={...initial};
const specs=[['lens','Lente',10,300,1,'mm'],['distortion','Distorção',0,100,1,'%'],['zoom','Zoom da cena',25,300,1,'%'],['yaw','Horizontal',-180,180,1,'°'],['pitch','Vertical',-85,85,.5,'°'],['roll','Inclinação do quadro',-180,180,1,'°'],['distance','Distância da câmera',4,500,.1,'u'],['panx','Horizontal',-100,100,1,'%'],['pany','Vertical',-100,100,1,'%'],['gx','Guias X',1,64,1,''],['gy','Guias Y',1,64,1,''],['gz','Guias Z',1,64,1,''],['width','Espessura',.5,4,.1,'px'],['opacity','Opacidade',10,100,1,'%'],['scale','Escala uniforme',.5,2.5,.1,'×']];
specs.forEach(([key,label,min,max,step,unit])=>{const el=document.getElementById(key+'-control');el.className='control';el.innerHTML=`<div class="control-head"><label for="${key}-n">${label}</label><div class="number"><input id="${key}-n" type="number" min="${min}" max="${max}" step="${step}" value="${values[key]}"><span class="unit">${unit}</span></div></div><input aria-label="${label}" id="${key}-r" type="range" min="${min}" max="${max}" step="${step}" value="${values[key]}">`;el.addEventListener('input',e=>{if(e.target.value==='')return;values[key]=Math.min(max,Math.max(min,Number(e.target.value)));el.querySelectorAll('input').forEach(i=>{if(i!==e.target)i.value=values[key]});draw();});});
function sync(){specs.forEach(([key])=>document.querySelectorAll('#'+key+'-control input').forEach(i=>i.value=values[key]));draw()}
document.querySelectorAll('[data-tab]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b===button)));document.querySelectorAll('.page').forEach(p=>p.hidden=p.id!==button.dataset.tab);document.querySelector('.scroll').scrollTop=0});
function restrictions(){const p=document.getElementById('perspective').value;document.getElementById('distortion-control').hidden=p!=='fish';['pitch','roll','yaw','lens'].forEach(k=>document.querySelectorAll('#'+k+'-control input').forEach(i=>i.disabled=k==='pitch'?['one','two'].includes(p):k==='roll'?p!=='free':k==='yaw'?p==='one':p==='ortho'));if(['one','two'].includes(p))values.pitch=0;if(p==='one')values.yaw=0;if(p!=='free')values.roll=0;sync()}
document.getElementById('perspective').onchange=restrictions;
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const v={front:[0,0],side:[90,0],top:[0,80],iso:[43,20]}[b.dataset.view];values.yaw=v[0];values.pitch=v[1];restrictions()});
document.getElementById('reset').onclick=()=>{Object.assign(values,initial);restrictions()};
document.getElementById('center').onclick=()=>document.querySelectorAll('.xyz input').forEach(i=>i.value=0);
document.getElementById('fit').onclick=()=>document.getElementById('status').textContent='Enquadrar: conectar ao comando do plugin UXP.';
['back','forward'].forEach(id=>document.getElementById(id).onclick=()=>{const i=document.querySelectorAll('.xyz input')[Number(document.getElementById('axis').value)];i.value=Number(i.value)+(id==='back'?1:-1)});
document.querySelectorAll('[data-axis]').forEach(c=>c.onchange=()=>document.querySelectorAll('#'+c.dataset.axis+'-control input').forEach(i=>i.disabled=!c.checked));
document.querySelectorAll('.profile button').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('.profile button').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('horizon').checked=i!==2;document.getElementById('vps').checked=i!==2;document.getElementById('axisColors').checked=i===1});
['apply','png','svg'].forEach(id=>document.getElementById(id).onclick=()=>document.getElementById('status').textContent='Prévia visual: esta ação exige conexão com o UXP.');
const canvas=document.getElementById('cube'),ctx=canvas.getContext('2d');function draw(){ctx.clearRect(0,0,176,176);const a=values.yaw*Math.PI/180,b=(values.pitch+15)*Math.PI/180;const pts=[];for(let z of [-1,1])for(let y of [-1,1])for(let x of [-1,1]){let X=x*Math.cos(a)+z*Math.sin(a),Z=-x*Math.sin(a)+z*Math.cos(a);pts.push([88+X*36,88+(y*Math.cos(b)-Z*Math.sin(b))*36]);}ctx.lineWidth=1.5;ctx.strokeStyle='#91a3ad';for(let i=0;i<8;i++)for(let bit of [1,2,4]){let j=i^bit;if(j>i){ctx.beginPath();ctx.moveTo(...pts[i]);ctx.lineTo(...pts[j]);ctx.stroke()}}ctx.font='18px Segoe UI';ctx.fillStyle='#b3b3b3';ctx.fillText('Y',83,18);ctx.fillStyle='#c0877d';ctx.fillText('X',145,145);ctx.fillStyle='#85a7ba';ctx.fillText('Z',15,145)}
let drag=null;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;values.yaw+=(e.clientX-drag[0]);values.pitch=Math.max(-85,Math.min(85,values.pitch+e.clientY-drag[1]));drag=[e.clientX,e.clientY];restrictions()};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;restrictions();
</script>
<link rel="stylesheet" href="reference-layout.css">
<script src="../../geometry.js"></script>
<script src="../../uxp/models.js"></script>
<script src="reference-layout.js"></script>
</body></html>
